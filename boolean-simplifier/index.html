<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Boolean Simplifier — พิมพ์สูตร ใช้รูปสมการ หรือวิเคราะห์วงจร Logic Gate" />
  <title>Boolean Simplifier</title>
  <link rel="stylesheet" href="styles.css?v=11" />
  <link rel="stylesheet" href="v3.css?v=11" />
  <link rel="stylesheet" href="v4.css?v=11" />
  <link rel="stylesheet" href="v5.css?v=11" />
  <link rel="stylesheet" href="v6.css?v=11" />
  <link rel="stylesheet" href="circuit.css?v=11" />
  <link rel="stylesheet" href="circuit-v9.css?v=11" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script src="app.js?v=11" defer></script>
  <script src="v3.js?v=11" defer></script>
  <script src="v4.js?v=11" defer></script>
  <script src="v11.js?v=11" defer></script>
  <script src="circuit-v9.js?v=11" defer></script>
</head>
<body>
  <main class="shell calculator-shell">
    <nav class="top-nav" aria-label="เมนูหลัก">
      <a class="brand-link" href="./">Boolean Simplifier</a>
      <div class="nav-tabs">
        <a class="nav-tab active" href="./" aria-current="page">คำนวณ</a>
        <a class="nav-tab" href="docs.html">คู่มือ</a>
      </div>
    </nav>

    <header class="calc-header minimal-header">
      <h1>ย่อสมการ</h1>
      <button id="exampleBtn" class="ghost-btn" type="button">ตัวอย่าง</button>
    </header>

    <section class="grid calculator-grid">
      <article class="card input-card compact-card">
        <label for="formulaInput">สูตร</label>
        <textarea id="formulaInput" rows="5" spellcheck="false" autocomplete="off" placeholder="พิมพ์สมการ Boolean ที่นี่..."></textarea>

        <div class="symbol-toolbar" aria-label="แทรกสัญลักษณ์ Boolean">
          <button type="button" class="symbol-btn" data-insert=" + " title="OR">∨ <small>OR</small></button>
          <button type="button" class="symbol-btn" data-insert=" * " title="AND">∧ <small>AND</small></button>
          <button type="button" class="symbol-btn" data-insert="!" title="NOT">¬ <small>NOT</small></button>
          <button type="button" class="symbol-btn" data-insert=" ⊕ " title="XOR">⊕ <small>XOR</small></button>
          <button type="button" class="symbol-btn" data-insert=" ⊙ " title="XNOR">⊙ <small>XNOR</small></button>
          <button type="button" class="symbol-btn" data-template="BAR()" data-cursor-back="1" title="Bar"><span class="mini-overbar">ABC</span> <small>BAR</small></button>
          <button type="button" class="symbol-btn" data-template="()" data-cursor-back="1" title="วงเล็บ">( )</button>
        </div>

        <div class="source-divider"><span>หรือใช้รูป</span></div>

        <div class="image-source-actions clean-image-actions">
          <label class="image-source-btn" for="imageInput">
            <input id="imageInput" type="file" accept="image/*" />
            <span aria-hidden="true">▣</span>
            <span><strong>เลือกรูป</strong><small>Photos / Files</small></span>
          </label>
          <label class="image-source-btn" for="cameraInput">
            <input id="cameraInput" type="file" accept="image/*" capture="environment" />
            <span aria-hidden="true">◉</span>
            <span><strong>ถ่ายรูป</strong><small>Camera</small></span>
          </label>
        </div>

        <div id="previewWrap" class="preview-wrap" hidden>
          <img id="preview" alt="ภาพที่เลือก" />
          <div class="ocr-row">
            <div class="ocr-info">
              <strong>IMAGE <span class="beta-pill">BETA</span></strong>
              <span id="ocrStatus">ยังไม่ได้เลือกรูป</span>
              <div class="progress-track" aria-hidden="true"><div id="ocrProgress" class="progress-bar"></div></div>
            </div>
            <div class="ocr-actions">
              <button id="ocrBtn" class="secondary-btn" type="button" disabled>อ่านข้อความ</button>
              <button id="circuitBtn" class="secondary-btn circuit-btn" type="button" disabled>วิเคราะห์วงจร</button>
            </div>
          </div>
        </div>

        <div id="errorBox" class="error" role="alert" hidden></div>

        <div class="actions compact-actions">
          <button id="simplifyBtn" class="primary-btn" type="button">ย่อสมการ</button>
          <button id="clearBtn" class="ghost-btn" type="button">ล้าง</button>
        </div>
      </article>

      <article class="card result-card compact-result-card">
        <div class="result-topline">
          <h2>ผลลัพธ์</h2>
          <a class="tiny-doc-link" href="docs.html">คู่มือ</a>
        </div>

        <div class="empty-state clean-empty" id="emptyState">
          <div class="logic-mark">01</div>
        </div>

        <div id="resultBox" hidden>
          <div id="resultFormula" class="result-formula"></div>
          <div class="normalized-block">
            <span>สูตรที่โปรแกรมอ่าน</span>
            <code id="normalizedFormula"></code>
          </div>
          <div id="resultMeta" class="result-meta"></div>
          <div class="method-note compact-method">
            <strong>Minimal SOP</strong>
          </div>
        </div>

        <div id="batchResults" class="batch-results" hidden></div>
      </article>
    </section>

    <footer class="minimal-footer">
      <span>Boolean Simplifier</span>
    </footer>
  </main>
</body>
</html>
